[project]
name = "pace-cli"
version = "2.0.0"
description = "Pace -- a CLI for Garmin Connect data."
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "fitdecode>=0.11.0",
    "garminconnect>=0.2.8",
    "matplotlib>=3.11.2",
    "pydantic>=2.12",
    "typer>=0.12",
]

[project.scripts]
pace = "pace.cli:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "ruff>=0.15.13",
    "ty>=0.0.35",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["pace"]
