[project]
name = "pace-cli"
version = "1.0.0"
description = "Pace -- a CLI for Garmin Connect data."
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "aionode>=0.3.0",
    "garminconnect>=0.2.8",
    "pydantic>=2.12",
    "readchar>=4.2.1",
    "rich>=13.7",
    "textual>=0.80",
    "typer>=0.12",
]

[project.scripts]
pace = "pace.cli:app"

[dependency-groups]
dev = [
    "click-man>=0.5",
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "ruff>=0.15.13",
    "ty>=0.0.35",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["pace"]
